
services:
  db:
    image: postgres:16-alpine
    container_name: senac-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: senac
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d senac"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: senac-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: senac
      PORT: 8080
    ports:
      - "8080:8080"

volumes:
  pgdata:
